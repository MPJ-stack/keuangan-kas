<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Keuangan</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:15px;
max-width:600px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

h1{
font-size:24px;
margin-bottom:5px;
}

.small{
font-size:13px;
color:#666;
}

.balance{
font-size:32px;
font-weight:bold;
color:#16a34a;
margin-top:10px;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.tx{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee;
}

.tx:last-child{
border:none;
}

.masuk{
color:#16a34a;
font-weight:bold;
}

.keluar{
color:#dc2626;
font-weight:bold;
}

.delete{
background:#dc2626;
width:auto;
padding:5px 10px;
margin-top:0;
font-size:12px;
}

.section-title{
margin-bottom:10px;
font-size:18px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="card">
<h1 id="appName">Kas MPJ</h1>
<p class="small">Aplikasi Keuangan Sederhana</p>

<div class="balance" id="saldo">Rp 0</div>
</div>

<div class="card">
<div class="section-title">Pengaturan</div>

<input id="namaKas" placeholder="Nama Kas">

<button onclick="simpanNamaKas()">
Simpan Nama Kas
</button>
</div>

<div class="card">
<div class="section-title">Tambah Transaksi</div>

<input type="date" id="tanggal">

<select id="jenis">
<option value="masuk">Pemasukan</option>
<option value="keluar">Pengeluaran</option>
</select>

<input id="kategori" placeholder="Kategori">

<input type="number" id="jumlah" placeholder="Jumlah">

<button onclick="tambahTransaksi()">
Simpan Transaksi
</button>
</div>

<div class="card">
<div class="section-title">Riwayat Transaksi</div>

<div id="listTransaksi">
Belum ada transaksi
</div>
</div>

<script>

let db = JSON.parse(
localStorage.getItem("kasData")
) || {
appName:"Kas MPJ",
transactions:[]
};

document.getElementById("tanggal").valueAsDate =
new Date();

function simpanDb(){
localStorage.setItem(
"kasData",
JSON.stringify(db)
);
}

function formatRupiah(angka){
return "Rp " +
Number(angka).toLocaleString("id-ID");
}

function simpanNamaKas(){

const nama =
document.getElementById("namaKas").value;

if(!nama) return;

db.appName = nama;

simpanDb();

render();
}

function tambahTransaksi(){

const tanggal =
document.getElementById("tanggal").value;

const jenis =
document.getElementById("jenis").value;

const kategori =
document.getElementById("kategori").value;

const jumlah =
document.getElementById("jumlah").value;

if(!tanggal || !jumlah){
alert("Lengkapi data");
return;
}

db.transactions.unshift({
id:Date.now(),
tanggal,
jenis,
kategori,
jumlah:Number(jumlah)
});

document.getElementById("kategori").value="";
document.getElementById("jumlah").value="";

simpanDb();

render();
}

function hapusTransaksi(id){

if(!confirm("Hapus transaksi?"))
return;

db.transactions =
db.transactions.filter(
x=>x.id!==id
);

simpanDb();

render();
}

function render(){

document.getElementById("appName")
.innerText = db.appName;

document.getElementById("namaKas")
.value = db.appName;

let saldo = 0;

db.transactions.forEach(tx=>{

if(tx.jenis==="masuk"){
saldo += tx.jumlah;
}else{
saldo -= tx.jumlah;
}

});

document.getElementById("saldo")
.innerText =
formatRupiah(saldo);

const list =
document.getElementById(
"listTransaksi"
);

if(db.transactions.length===0){

list.innerHTML =
"Belum ada transaksi";

return;
}

list.innerHTML="";

db.transactions.forEach(tx=>{

list.innerHTML += `
<div class="tx">
<div>
<div><b>${tx.kategori || '-'}</b></div>
<div class="small">
${tx.tanggal}
</div>
</div>

<div>
<div class="${
tx.jenis==="masuk"
? "masuk"
: "keluar"
}">
${tx.jenis==="masuk" ? "+" : "-"}
${formatRupiah(tx.jumlah)}
</div>

<button
class="delete"
onclick="hapusTransaksi(${tx.id})">
Hapus
</button>
</div>
</div>
`;

});

}

render();

</script>

</body>
</html>
