<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Keuangan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.card{
    max-width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="card">

<h2>Daftar Akun</h2>

<input id="username" placeholder="Username">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Daftar</button>

<hr>

<h2>Login</h2>

<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<script>
alert("SCRIPT BARU JALAN");
const SUPABASE_URL =
"https://awkajtzfswtgpcebrsam.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3a2FqdHpmc3d0Z3BjZWJyc2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Mjk1ODUsImV4cCI6MjA5NjEwNTU4NX0.fWspfwacvmA-TjwW1VtlaVqAHjQenvrykT04Bbn0Zew";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

async function register(){

const username =
document.getElementById("username").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const { data, error } =
await supabase.auth.signUp({
email,
password
});

if(error){
document.getElementById("msg").innerText =
error.message;
return;
}

await supabase
.from("profiles")
.insert({
id:data.user.id,
username:username,
email:email,
display_name:"Kas " + username
});

document.getElementById("msg").innerText =
"Register berhasil";
}

async function login(){

const email =
document.getElementById("loginEmail").value;

const password =
document.getElementById("loginPassword").value;

const { error } =
await supabase.auth.signInWithPassword({
email,
password
});

if(error){
document.getElementById("msg").innerText =
error.message;
return;
}

document.getElementById("msg").innerText =
"LOGIN BERHASIL";
}

</script>

</body>
</html>
